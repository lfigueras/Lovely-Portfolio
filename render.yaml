services:
  - type: web
    name: lovely-portfolio
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lovely-portfolio-db
          property: connectionString
      - key: PORT
        value: "10000"

databases:
  - name: lovely-portfolio-db
    databaseName: lovely_portfolio
    user: lovely_portfolio
    plan: free
    region: singapore